# BT-Shutdown example configuration file in INI format.
# See Docs/BT-Shutdown.md for the full specification of every key below.
# See Docs/Glossary.md for definitions of terms marked in **bold** in the comments.
# NOTE: values are read verbatim by `findstr` — do NOT put quotes around paths or numbers.
# NOTE: lines beginning with `#` are treated as comments.
# NOTE: all paths in this example are relative to the **BackupToolkitHome** root.

[Settings]
# Existing folder that will receive the invocation log `BT-Shutdown_YYYY-MM-DD_HH-MM-SS.log`.
# Must end with a trailing backslash (the file name is appended directly).
# If empty or the folder does not exist, the script exits with code 1 before any check is performed.
logpath=Examples\BTRepository\BackupSystem\logs\

# Minimum host uptime (in minutes) before a shutdown is allowed.
# Current uptime is derived from `LastBootUpTime` and rounded to whole minutes.
threshold_min=60

# Lower bound of the allowed shutdown hour range (inclusive), integer 0-23.
start_hour=3

# Upper bound of the allowed shutdown hour range (exclusive), integer 0-23.
# If `end_hour <= start_hour`, the window is treated as spanning midnight
# (e.g. start_hour=22, end_hour=2 allows shutdown at 22, 23, 0 and 1).
end_hour=21

# Global kill-switch. `1` enables the shutdown; any other value (including empty) runs in simulation mode.
# Tip: set to `0` first to run in simulation mode and verify the decision path in the log.
shutdown_allow=0

# Grace period (in seconds) passed to `shutdown /s /t <n>` between the call and actual power-off.
# Large enough values let logged-in users abort with `shutdown /a` if needed.
# Typical production value is 60 seconds; set to 600 here for testing to give more time to abort.
shutdown_delay=600

# Folder scanned for the presence of `*.flg` and `*.lock` files (a **Lock** vetoes the shutdown).
# Typically points at the Backup-Toolkit `Locks/` folder so an in-progress **Session**
# of BT-Backup or BT-Plan prevents the shutdown. Must end with a trailing backslash.
# Leave empty to skip this check entirely.
flag_path=Examples\BTRepository\Locks\

# Recipient list for the shutdown-notification e-mail, forwarded to `mail_prog`.
# Multiple addresses can be separated by `;` (as accepted by BT-Mail-Send).
# Leave empty to skip the notification.
mail_to=

# Full path to a **.BT-Mail-Credentials** file (DPAPI-protected SMTP credentials for the current user).
# Leave empty to skip the notification.
mail_credentials=

# Full path to the mail-sending program (usually `Tools/BT-Mail-Send.cmd`).
# It is invoked as: mail_prog "mail_credentials" "mail_to" "<subject>" "<body>".
# Leave empty to skip the notification.
# NOTE: the mail is dispatched only when `mail_to`, `mail_credentials` and `mail_prog` are ALL set.
mail_prog=Tools\BT-Mail-Send.cmd
